# * 🌌 L€yzS Ricing - Advanced Lockscreen Configuration 🌌
# 🛠️  Architected by L€yzS
# 🔐  Vertical Clock Design & Profile Image Integration.

# --- 🎨 COLOR DYNAMICS (PYWAL) ---
# [TR] Pywal ile renkleri sisteme bağlar / [EN] Connects colors via Pywal
source = $HOME/.cache/wal/colors-hyprland.conf

# --- 🖼️ BACKGROUND / ARKA PLAN ---
background {
    monitor =
    # Symlink mantenido por pywal: siempre apunta al wallpaper actual del escritorio
    path = $HOME/.cache/current_wall
    blur_passes = 3
    contrast = 0.8
    brightness = 0.5
    vignette = 0.5
    vignette_opacity = 0.3
    crossfade_time = 0.5
}

# --- 🕒 VERTICAL CLOCK (UPPER - HOUR) / DİKEY SAAT (ÜST) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 80
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 230
    halign = center
    valign = center
}

# --- 🕒 VERTICAL CLOCK (LOWER - MINUTE) / DİKEY SAAT (ALT) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 80
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 115
    halign = center
    valign = center
}

# --- 📅 CALENDAR / TAKVİM ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %b")"
    color = rgba(255, 255, 255, 0.6)
    font_size = 13
    font_family = JetBrains Mono Nerd Font
    position = 0, 35
    halign = center
    valign = center
}

# --- 👤 PROFILE IMAGE / PROFİL RESMİ ---
image {
    monitor =
   
    # =========================================================================================
    # [TR] OTOMATİK PROFİL FOTOĞRAFI:
    # Home dizininizdeki 'Hyprlock-Pfp' klasörüne gidin ve istediğiniz resmi oraya atın.
    # ÖNEMLİ: Dosyanın adını 'picture.png' (veya .jpg ise aşağıyı güncelleyin) yapmanız yeterlidir.
    #
    # [EN] AUTOMATIC PROFILE PICTURE:
    # Go to the 'Hyprlock-Pfp' folder in your Home directory and place your image there.
    # IMPORTANT: Just rename your file to 'picture.png' (or update below if using .jpg).
    # =========================================================================================
    path = __HOME__/.config/Hyprlock-Pfp/picture.jpg
        
    size = 130
    rounding = -1 # [TR] Tam yuvarlak / [EN] Perfect circle
    border_size = 4
    border_color = rgb(0, 0, 0)
    position = 0, 160
    halign = center
    valign = bottom
}

# --- ⌨️ INPUT FIELD / ŞİFRE ALANI ---
input-field {
    monitor =
    size = 210, 40
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Password...</span>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}
