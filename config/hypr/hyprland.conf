general {
    gaps_in = 0
    gaps_out = 0
}

# Waydroid a workspace 7 (que esta en HDMI-A-1)
windowrulev2 = workspace 7 silent, class:Waydroid
windowrulev2 = fullscreen, class:Waydroid
windowrulev2 = noborder, class:Waydroid

# Binds
bind = SUPER, 1, workspace, 1
bind = SUPER, 7, workspace, 7

# --- Waydroid: encendido/arranque/apagado bajo demanda ---
# NOTA — SUPER+X queda RESERVADO a cerrar terminales.
# El apagado manual va en SUPER+SHIFT+X para no chocar con esa acción.
#
# SUPER+G → arrancar Saint Seiya (enciende Waydroid solo si hace falta)
bind = SUPER, G, exec, __HOME__/bin/waydroid-game.sh com.tencent.tmgp.sskeus
# SUPER+SHIFT+X → apagar Waydroid por completo (cierra ventana + sesión + contenedor)
bind = SUPER SHIFT, X, exec, __HOME__/bin/waydroid-stop
# SUPER+SHIFT+W → abrir solo Waydroid UI sin juego
bind = SUPER SHIFT, W, exec, __HOME__/bin/waydroid-game.sh

# Cerrar todo y abrir Waydroid
exec-once = pkill -9 -f alacritty; pkill -9 -f brave; sleep 2

# 👇 AGREGAR ESTO 👇
input {
    kb_layout = es
    follow_mouse = 1
}
# Teclado: layout español
device {
    name = by-tech-gaming-keyboard
    kb_layout = es
}

# by-tech gaming: forzar todos los sub-dispositivos
device {
    name = by-tech-gaming-keyboard-1
    kb_layout = es
}

device {
    name = by-tech-gaming-keyboard-consumer-control
    kb_layout = es
}

device {
    name = by-tech-gaming-keyboard-system-control
    kb_layout = es
}
